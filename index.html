<!doctype html>
<html lang="en" data-theme="system" data-wallpaper="mountains">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="SkyRight brings together campus services, AI tools, research resources, and everyday sites.">
  <meta name="referrer" content="no-referrer">
  <title>SkyRight</title>
  <meta property="og:title" content="SkyRight">
  <link rel="icon" href="./assets/avatar.png" type="image/png">
  <link rel="preload" href="./assets/fonts/instrument-sans.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    let theme = 'system';
    try {
      const preferences = JSON.parse(localStorage.getItem('startpage.preferences'));
      if (['system', 'light', 'dark'].includes(preferences?.theme)) theme = preferences.theme;
      if (typeof preferences?.wallpaper === 'string') document.documentElement.dataset.wallpaper = preferences.wallpaper;
    } catch {}
    document.documentElement.dataset.theme = theme === 'system'
      ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
      : theme;
  </script>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <a class="skip-link" href="#directory">Skip to directory</a>
  <div class="landscape" aria-hidden="true"><img id="wallpaper" alt="" decoding="async" fetchpriority="high"></div>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="./">
        <span class="avatar" aria-hidden="true"><span>SR</span><img id="brand-photo" src="./assets/avatar.png" alt="" width="40" height="40"></span>
        <span>SkyRight</span>
      </a>
      <div class="header-actions">
        <button class="icon-button" id="theme-toggle" type="button" aria-label="Switch color theme" title="Switch color theme">
          <svg class="icon theme-sun" aria-hidden="true"><use href="./assets/ui.svg#sun"/></svg>
          <svg class="icon theme-moon" aria-hidden="true"><use href="./assets/ui.svg#moon"/></svg>
        </button>
        <button class="icon-button" id="open-settings" type="button" aria-label="Settings" title="Settings" aria-haspopup="dialog">
          <svg class="icon" aria-hidden="true"><use href="./assets/ui.svg#sliders-horizontal"/></svg>
        </button>
      </div>
    </header>

    <main>
      <h1 class="sr-only">SkyRight start page</h1>
      <section class="hero" aria-label="Clock and search">
        <div class="clock">
          <time id="clock-time"></time>
          <time id="clock-date"></time>
        </div>
        <div class="search" id="search">
          <form id="web-search" class="search-form" role="search" method="get" action="https://www.bing.com/search" target="_blank" rel="noopener noreferrer">
            <button class="search-submit" type="submit" aria-label="Search the web" title="Search the web">
              <svg class="icon" aria-hidden="true"><use href="./assets/ui.svg#magnifying-glass"/></svg>
            </button>
            <input id="query" aria-label="Search the web or your sites" aria-controls="site-results" name="q" type="search" placeholder="Search the web or your sites" autocomplete="off" enterkeyhint="search">
            <button id="clear-query" class="search-clear" type="button" aria-label="Clear search" hidden>
              <svg class="icon" aria-hidden="true"><use href="./assets/ui.svg#x"/></svg>
            </button>
            <kbd class="search-key" title="Press /, Ctrl + K, or ⌘ + K to search">/</kbd>
            <label class="engine">
              <img id="engine-icon" src="./assets/icons/bing.svg" width="17" height="17" alt="">
              <span id="engine-label">Bing</span>
              <svg class="icon" aria-hidden="true"><use href="./assets/ui.svg#caret-down"/></svg>
              <select id="engine-select" aria-label="Search engine">
                <option value="bing">Bing</option>
                <option value="google">Google</option>
                <option value="baidu">Baidu</option>
              </select>
            </label>
          </form>
          <section id="site-results" class="site-results" aria-label="Matching sites" hidden>
            <p class="result-caption" id="result-caption" role="status"></p>
            <ul id="result-list" class="site-list"></ul>
          </section>
        </div>
      </section>

      <section class="favorites" aria-labelledby="favorites-title" hidden>
        <h2 id="favorites-title">Favorites</h2>
        <ul class="site-list favorites-list" id="favorites"></ul>
      </section>

      <section class="directory" id="directory" aria-labelledby="directory-title" tabindex="-1">
        <div class="directory-header">
          <h2 id="directory-title">Directory</h2>
          <nav id="category-filters" class="category-filters" aria-label="Categories"></nav>
        </div>
        <div class="groups" id="groups"></div>
        <noscript><p>Enable JavaScript to see the directory.</p></noscript>
      </section>
    </main>

    <footer class="footer">
      <a id="photo-credit" target="_blank" rel="noopener noreferrer" hidden></a>
    </footer>
  </div>

  <dialog id="settings" aria-labelledby="settings-title">
    <div class="dialog-header">
      <h2 id="settings-title">Settings</h2>
      <form method="dialog">
        <button class="icon-button" type="submit" aria-label="Close settings" autofocus>
          <svg class="icon" aria-hidden="true"><use href="./assets/ui.svg#x"/></svg>
        </button>
      </form>
    </div>
    <fieldset>
      <legend>Appearance</legend>
      <div class="choices" id="theme-choices">
        <label><input type="radio" name="theme" value="system"><span>System</span></label>
        <label><input type="radio" name="theme" value="light"><span>Light</span></label>
        <label><input type="radio" name="theme" value="dark"><span>Dark</span></label>
      </div>
    </fieldset>
    <fieldset>
      <legend>Background</legend>
      <div class="choices" id="wallpaper-choices"></div>
    </fieldset>
    <p class="settings-note" id="settings-note">Settings are saved in this browser.</p>
  </dialog>
</body>
</html>
